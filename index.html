<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2f8f">
<title>Ôn tập KHTN 9 Hoá</title>

<!-- ✅ BẢN NHÁP — cô duyệt trước khi dùng.
     Ôn tập & kiểm tra KHTN 9 (mạch Hoá) giữa HKI 2026–2027 · soạn từ đề cương ôn tập của cô.
     Chạy một file, không thư viện ngoài. Chỉ MỘT chỗ gọi mạng: gửi kết quả bài kiểm tra tới Google Sheet CỦA CÔ
     (địa chỉ Apps Script ghi ở cau-hinh.json → sheetUrl). Để trống = chỉ lưu trên máy học sinh. -->
<style>
:root{
  --ink:#1c2340; --mut:#5d6684; --line:#dfe3f2; --card:#ffffff; --bg1:#eef3ff; --bg2:#f7f0ff;
  --pri:#4a48e0; --pri2:#7a5cf5; --acc:#ff7a45; --ok:#16a870; --okbg:#e3f8ee; --bad:#e5484d; --badbg:#fdecec;
  --warn:#f5a524; --warnbg:#fff4de; --sel:#e8e8ff;
  --b01:#14b8a6; --b18:#f97316; --b19:#8b5cf6; --b20:#ef4444; --th:#e0a100;
  --r:18px; --sh:0 10px 30px rgba(52,58,140,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#e8ebff; --mut:#a3abd0; --line:#323a66; --card:#1b2145; --bg1:#0f1330; --bg2:#1a1140;
    --sel:#2b3170; --okbg:#0f3a2b; --badbg:#431a22; --warnbg:#43340f; --sh:0 10px 30px rgba(0,0,0,.4); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);font-size:16px;line-height:1.5;
  background:radial-gradient(900px 500px at 8% -10%,rgba(122,92,245,.22),transparent 60%),radial-gradient(800px 500px at 100% 0%,rgba(20,184,166,.18),transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;min-height:100vh}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.25;margin:.2em 0 .4em}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
.hide{display:none!important}
/* ---------- nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border:0;border-radius:14px;cursor:pointer;
  font-weight:700;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 6px 16px rgba(74,72,224,.35);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)} .btn:active{transform:translateY(1px) scale(.98)}
.btn.sec{background:var(--card);color:var(--pri);border:2px solid var(--pri);box-shadow:none}
.btn.gh{background:transparent;color:var(--mut);box-shadow:none;border:2px solid var(--line)}
.btn.ok{background:linear-gradient(135deg,#12a36a,#25c785);box-shadow:0 6px 16px rgba(22,168,112,.35)}
.btn.bad{background:linear-gradient(135deg,#e5484d,#ff7a6b);box-shadow:0 6px 16px rgba(229,72,77,.3)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--sel);color:var(--pri);font-size:13px;font-weight:700}
.chip.nb{background:#e3f8ee;color:#0b7a50}.chip.th{background:#e6efff;color:#2756c5}.chip.vd{background:#fff0d9;color:#a15c00}.chip.vdc{background:#ffe3e3;color:#b3262b}
.draft{display:inline-block;background:var(--warnbg);color:#8a5a00;border:1px dashed var(--warn);padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line)}
/* ---------- chào mừng */
.hero{position:relative;overflow:hidden;border-radius:28px;color:#fff;margin-top:6px;
  background:radial-gradient(500px 300px at 85% 10%,rgba(255,255,255,.18),transparent 60%),linear-gradient(135deg,#2b2f8f 0%,#5b3fd9 45%,#0ea5a4 110%);box-shadow:0 20px 50px rgba(43,47,143,.38)}
.hero .in{display:grid;grid-template-columns:1.1fr .9fr;gap:8px;align-items:center;padding:34px 34px 28px}
.hero h1{font-size:clamp(26px,5vw,44px);margin:6px 0 8px;letter-spacing:.2px}
.hero h1 span{background:linear-gradient(90deg,#ffe27a,#ffb36b);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:.3em 0;opacity:.92}
.hero .tag{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.16);padding:5px 12px;border-radius:999px;font-weight:700;font-size:14px;backdrop-filter:blur(4px)}
.hero svg.art{width:100%;height:auto;max-height:330px}
.tile{position:absolute;width:52px;height:58px;border-radius:10px;background:rgba(255,255,255,.95);color:#2b2f8f;text-align:center;box-shadow:0 8px 18px rgba(0,0,0,.25);animation:float 6s ease-in-out infinite}
.tile i{display:block;font-style:normal;font-size:10px;text-align:left;padding:3px 0 0 6px;opacity:.7}
.tile b{display:block;font-size:22px;margin-top:-2px}
.tile.t1{left:90%;top:9%;border-top:5px solid #f97316}.tile.t2{left:47%;top:6%;animation-delay:-1.5s;border-top:5px solid #b45309}
.tile.t3{left:45%;top:70%;animation-delay:-3s;border-top:5px solid #eab308}.tile.t4{left:90%;top:56%;animation-delay:-4.5s;border-top:5px solid #64748b}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.form{margin:-24px 18px 0;position:relative;padding:22px;display:grid;gap:14px}
.form label{font-weight:700;font-size:14px;color:var(--mut);display:block;margin-bottom:4px}
.inp{width:100%;min-height:50px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(74,72,224,.15)}
.inp.err{border-color:var(--bad);background:var(--badbg)}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.msg{font-size:14px;margin-top:4px;min-height:1.2em}.msg.err{color:var(--bad);font-weight:600}
.form label.cl{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:500;color:var(--ink);margin:0}.cl input{width:22px;height:22px;margin-top:2px;accent-color:var(--pri)}
/* ---------- trang bài */
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 4px;flex-wrap:wrap}
.who{display:flex;gap:10px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--acc));color:#fff;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin:12px 0}
.bai{position:relative;padding:18px;cursor:pointer;overflow:hidden;transition:transform .15s,box-shadow .15s;border-top:6px solid var(--c)}
.bai:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(52,58,140,.2)}
.bai .ic{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent)}
.bai h3{margin:10px 0 2px;font-size:20px}.bai p{margin:0;color:var(--mut);font-size:14.5px}
.bai .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.bai .best{position:absolute;right:14px;top:14px;text-align:right;font-size:12px;color:var(--mut)}
.bai .best b{display:block;font-size:22px;color:var(--c)}
.bai::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:var(--c);opacity:.08}
.resume{padding:14px 18px;margin:10px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warnbg);border:1px solid var(--warn)}
/* ---------- một bài */
.hd{display:flex;gap:14px;align-items:center;padding:16px 18px;margin:8px 0 14px;border-left:8px solid var(--c)}
.hd .ic{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tab{padding:14px 8px;border-radius:16px;border:2px solid var(--line);background:var(--card);cursor:pointer;text-align:center;font-weight:800;transition:all .15s}
.tab small{display:block;font-weight:500;color:var(--mut);font-size:12.5px}
.tab.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card));box-shadow:0 8px 20px color-mix(in srgb,var(--c) 28%,transparent)}
.tab .e{font-size:24px;display:block}
.lt{padding:18px 20px;overflow-x:auto}
.lt h4{color:var(--c);font-size:18px;margin-top:1.1em;border-bottom:2px solid color-mix(in srgb,var(--c) 30%,transparent);padding-bottom:4px}
table.bang{border-collapse:collapse;width:100%;margin:8px 0;font-size:15px;min-width:420px}
.bang th{background:color-mix(in srgb,var(--c) 18%,var(--card));text-align:left}
.bang th,.bang td{border:1px solid var(--line);padding:7px 10px;vertical-align:top}
.nho{background:var(--warnbg);border-left:5px solid var(--warn);padding:10px 14px;border-radius:10px;margin:10px 0}
code{background:var(--sel);padding:1px 7px;border-radius:7px;font-family:inherit;font-weight:600}
.day{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.day span{padding:10px 14px;border-radius:12px;font-weight:800;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.15);position:relative}
.day .m1{background:linear-gradient(135deg,#ef4444,#f97316)}.day .m2{background:linear-gradient(135deg,#8b5cf6,#6366f1)}
.day .m3{background:linear-gradient(135deg,#0ea5a4,#38bdf8)}.day .mh{background:#64748b;border-radius:50%}
.nhe{color:var(--mut);font-size:14px;margin:.2em 0 .6em}
/* ---------- ôn tập, kiểm tra */
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding:16px}
.pk{padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--card);cursor:pointer;text-align:left;transition:all .15s}
.pk:hover{border-color:var(--c);transform:translateY(-3px)}
.pk b{font-size:17px;display:block}.pk span{color:var(--mut);font-size:14px}
.pk .e{font-size:26px}
.rule{padding:18px 20px;line-height:1.7}
.rule ul{margin:.3em 0 .6em 1.1em;padding:0}
.stage{display:grid;grid-template-columns:1fr 250px;gap:16px;align-items:start}
.q{padding:20px 22px}
.q .no{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--c);margin-bottom:6px;flex-wrap:wrap}
.q .no .n{background:var(--c);color:#fff;border-radius:10px;padding:2px 12px}
.q .txt{font-size:18px;font-weight:600;margin:6px 0 14px}
.q .txt table{margin-top:10px}
.op{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;min-height:52px;font-size:16.5px;transition:all .12s}
.op:hover{border-color:var(--pri);background:var(--sel)}
.op .l{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--sel);color:var(--pri)}
.op.sel{border-color:var(--pri);background:var(--sel);box-shadow:0 0 0 3px rgba(74,72,224,.18)}
.op.sel .l{background:var(--pri);color:#fff}
.op.good{border-color:var(--ok);background:var(--okbg)}.op.good .l{background:var(--ok);color:#fff}
.op.wrong{border-color:var(--bad);background:var(--badbg);animation:shake .35s}.op.wrong .l{background:var(--bad);color:#fff}
.op.lock{cursor:default}.op.lock:hover{background:inherit;border-color:inherit}
.op.good.lock:hover{background:var(--okbg);border-color:var(--ok)}.op.wrong.lock:hover{background:var(--badbg);border-color:var(--bad)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.ds{border:2px solid var(--line);border-radius:14px;margin:9px 0;padding:10px 12px;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.ds .l{width:30px;height:30px;border-radius:50%;background:var(--sel);color:var(--pri);display:grid;place-items:center;font-weight:800}
.ds .tf{display:flex;gap:6px}
.tfb{min-width:62px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:800}
.tfb.sel.d{background:var(--ok);border-color:var(--ok);color:#fff}.tfb.sel.s{background:var(--bad);border-color:var(--bad);color:#fff}
.ds.good{border-color:var(--ok);background:var(--okbg)}.ds.wrong{border-color:var(--bad);background:var(--badbg)}
.ds .ex{grid-column:2/4;font-size:14.5px;color:var(--mut)}
.ans{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ans .inp{max-width:260px;font-size:20px;font-weight:700;text-align:center}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:15.5px;animation:pop .25s}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}.fb.no{background:var(--badbg);border:1px solid var(--bad)}.fb.pt{background:var(--warnbg);border:1px solid var(--warn)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.side{padding:14px;position:sticky;top:10px}
.side h4{margin:0 0 8px;font-size:15px}
.side summary{cursor:pointer;list-style:none;font-size:15px;padding:2px 0;min-height:32px;display:flex;align-items:center}.side summary::-webkit-details-marker{display:none}
.side .sec{font-size:12.5px;color:var(--mut);font-weight:700;margin:10px 0 4px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.nb{min-height:40px;border-radius:11px;border:2px solid var(--line);background:var(--card);font-weight:800;cursor:pointer;position:relative;transition:all .12s}
.nb.done{background:var(--ok);border-color:var(--ok);color:#fff}
.nb.part{background:var(--warnbg);border-color:var(--warn)}
.nb.good{background:var(--ok);border-color:var(--ok);color:#fff}.nb.wr{background:var(--bad);border-color:var(--bad);color:#fff}
.nb.cur{outline:3px solid var(--pri);outline-offset:1px}
.nb.flag::after{content:"🚩";position:absolute;right:-5px;top:-9px;font-size:13px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--acc));border-radius:99px;transition:width .3s}
.exam-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;margin:0 0 12px;border-radius:0 0 18px 18px;
  color:#fff;background:linear-gradient(135deg,#2b2f8f,#5b3fd9);box-shadow:0 8px 22px rgba(43,47,143,.3);flex-wrap:wrap}
.timer{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.18);padding:4px 14px;border-radius:12px}
.timer.low{background:#e5484d;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
/* ---------- kết quả */
.res{text-align:center;padding:26px 18px}
.ring{width:210px;height:210px;margin:6px auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-content:center}
.ring .v b{font-size:52px;line-height:1}.ring .v span{color:var(--mut)}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.part{padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.part b{font-size:22px}.part small{display:block;color:var(--mut)}
.hint{text-align:left;padding:14px 16px;margin:12px 0;border-radius:14px;background:var(--sel)}
.state{margin:10px 0;padding:10px 14px;border-radius:12px;font-weight:600}
.state.ok{background:var(--okbg);color:#0b6b46}.state.wait{background:var(--warnbg);color:#8a5a00}.state.no{background:var(--badbg);color:#a3262b}
.foot{text-align:center;color:var(--mut);font-size:13px;padding:22px 8px 30px}
.mascot{width:96px;height:96px}
.modal{position:fixed;inset:0;background:rgba(15,19,48,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal>div{max-width:420px;width:100%;padding:22px;animation:pop .2s}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:60}
.snd{background:rgba(255,255,255,.18);border:0;border-radius:12px;color:#fff;min-width:44px;min-height:44px;cursor:pointer;font-size:18px}
@media (max-width:860px){
  .hero .in{grid-template-columns:1fr;padding:22px 20px 40px}.hero svg.art{max-height:230px}
  .stage{grid-template-columns:1fr}.side{position:static}.side.ex{order:-1}.nums{grid-template-columns:repeat(8,1fr)}
  .row2{grid-template-columns:1fr}.form{margin:-18px 10px 0}
  .tile{display:none}
}
@media (max-width:480px){.wrap{padding:10px}.q{padding:14px}.q .txt{font-size:17px}.nums{grid-template-columns:repeat(6,1fr)}.ds{grid-template-columns:30px 1fr}.ds .tf{grid-column:1/3}.ds .ex{grid-column:1/3}.ring{width:170px;height:170px}.ring .v b{font-size:42px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dffd8"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
  <linearGradient id="gls" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#cfe1ff" stop-opacity=".5"/></linearGradient>
  <linearGradient id="gld" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
</defs></svg>
<canvas id="cf"></canvas>

<script>
const DATA={"phut":30,"de":{"tn":{"diem":0.25,"mau":{"NB":8,"TH":4}},"ds":{"diem":1.0,"mau":{"NB":2,"TH":1,"VD":1}},"tln":{"diem":0.5,"lt":{"TH":2,"VD":1,"VDC":1},"tt":{"VD":1,"VDC":1},"lt_het":{"TH":2,"VD":2,"VDC":2}}},"bai":[{"id":"b01","ten":"Bài 1","mota":"Dụng cụ, hoá chất, thuyết trình","tinh":false,"lt":"<h4>I. Dụng cụ thí nghiệm và cách sử dụng<\/h4>\n<table class=\"bang\"><tr><th>Dụng cụ<\/th><th>Chức năng<\/th><th>Lưu ý<\/th><\/tr>\n<tr><td><b>Bát sứ<\/b><\/td><td>Trộn hoặc đun nóng chảy chất rắn; cô đặc, cô cạn dung dịch; một số phản ứng toả nhiệt mạnh<\/td><td>Chịu nhiệt tốt; để nguội trước khi rửa<\/td><\/tr>\n<tr><td><b>Phễu thường<\/b><\/td><td>Rót chất lỏng; lọc chất rắn ra khỏi chất lỏng<\/td><td>Bằng thuỷ tinh hoặc nhựa<\/td><\/tr>\n<tr><td><b>Phễu chiết<\/b><\/td><td>Tách chất theo phương pháp chiết (hai chất lỏng không tan vào nhau)<\/td><td>Dễ vỡ, khoá phễu phải kín<\/td><\/tr>\n<tr><td><b>Bình cầu<\/b><\/td><td>Đựng chất lỏng, pha chế dung dịch, đun nóng, chưng cất<\/td><td>Thuỷ tinh; không đun trực tiếp trên ngọn lửa<\/td><\/tr>\n<tr><td><b>Lưới tản nhiệt<\/b><\/td><td><b>Phân tán nhiệt<\/b> khi đốt<\/td><td>Đặt giữa ngọn lửa và dụng cụ thuỷ tinh để nóng đều, không nứt vỡ<\/td><\/tr><\/table>\n<div class=\"nho\"><b>Vì sao<\/b> đun cốc thuỷ tinh phải dùng lưới tản nhiệt? Nhiệt được phân tán đều ra đáy cốc, cốc không nóng cục bộ nên không nứt, vỡ.<\/div>\n\n<h4>II. Hoá chất cơ bản trong phòng thí nghiệm<\/h4>\n<p><b>7 nhóm<\/b>: kim loại (Na, Fe, Cu…) · phi kim (S, I₂…) · oxide (CuO, CaO, MnO₂…) · acid (HCl, H₂SO₄…) · base (NaOH, NH₃…) · chất hữu cơ (C₂H₅OH, C₆H₁₂O₆…) · chất chỉ thị (giấy pH, phenolphthalein…).<\/p>\n<p><b>Bảo quản:<\/b> chai lọ có <b>nắp đậy<\/b>, dán <b>nhãn<\/b>. Hoá chất dễ bị ánh sáng phân huỷ (<b>KMnO₄, AgNO₃<\/b>…) đựng trong <b>lọ tối màu<\/b>, để nơi tối.<\/p>\n<p><b>An toàn:<\/b><\/p>\n<ul>\n<li>Lấy hoá chất bằng dụng cụ <b>riêng, sạch<\/b>; hoá chất thừa <b>không đổ trở lại<\/b> lọ gốc.<\/li>\n<li><b>Đọc kĩ nhãn<\/b> trước khi dùng để tránh dùng nhầm.<\/li>\n<li><b>Không tự ý nghiền, trộn<\/b> hoá chất: có thể cháy, nổ, sinh khí độc.<\/li>\n<li>Hoá chất dễ bay hơi, độc hại, nguy hiểm: làm nơi thoáng; đeo kính, găng tay, khẩu trang. Pha loãng H₂SO₄ đặc: <b>rót từ từ acid vào nước, khuấy nhẹ<\/b>.<\/li><\/ul>\n\n<h4>III. Báo cáo một vấn đề khoa học — 8 phần<\/h4>\n<table class=\"bang\"><tr><th>STT<\/th><th>Phần<\/th><th>Nội dung<\/th><\/tr>\n<tr><td>1<\/td><td><b>Tiêu đề<\/b><\/td><td>Chính xác, mô tả rõ nội dung<\/td><\/tr>\n<tr><td>2<\/td><td><b>Tóm tắt<\/b><\/td><td>Mục tiêu, phương pháp, kết quả, kết luận<\/td><\/tr>\n<tr><td>3<\/td><td><b>Giới thiệu<\/b><\/td><td>Vấn đề nghiên cứu, tầm quan trọng, mục tiêu<\/td><\/tr>\n<tr><td>4<\/td><td><b>Phương pháp<\/b><\/td><td>Cách thực hiện; liệt kê vật liệu, hoá chất, dụng cụ<\/td><\/tr>\n<tr><td>5<\/td><td><b>Kết quả<\/b><\/td><td>Dữ liệu rõ ràng bằng biểu đồ, hình ảnh, bảng<\/td><\/tr>\n<tr><td>6<\/td><td><b>Thảo luận<\/b><\/td><td>Phân tích, giải thích ý nghĩa; so sánh với nghiên cứu khác<\/td><\/tr>\n<tr><td>7<\/td><td><b>Kết luận<\/b><\/td><td>Tóm tắt phát hiện chính, gợi ý nghiên cứu tiếp<\/td><\/tr>\n<tr><td>8<\/td><td><b>Tài liệu tham khảo<\/b><\/td><td>Liệt kê mọi nguồn thông tin đã dùng<\/td><\/tr><\/table>\n<div class=\"nho\">Mẹo nhớ: <b>T<\/b>iêu đề – <b>T<\/b>óm tắt – <b>G<\/b>iới thiệu – <b>P<\/b>hương pháp – <b>K<\/b>ết quả – <b>T<\/b>hảo luận – <b>K<\/b>ết luận – <b>T<\/b>ài liệu.<\/div>\n\n<h4>IV. Thuyết trình một vấn đề khoa học<\/h4>\n<p><b>Phần mềm trình chiếu<\/b> (8 trang): Tiêu đề, tên tác giả → Giới thiệu → Mục tiêu → Phương pháp → Kết quả → Thảo luận → Kết luận → Câu hỏi của người dự và trả lời. Ngôn ngữ đơn giản, tập trung thông điệp chính, tương tác với người nghe.<\/p>\n<p><b>Báo cáo treo tường (poster):<\/b> khổ chuẩn <b>A0 hoặc A1<\/b>; tiêu đề rõ, tên tác giả dưới tiêu đề; chia khu vực rõ ràng; màu nền <b>không quá rực rỡ<\/b>, chữ – nền <b>tương phản<\/b>; <b>ít chữ<\/b>, nhiều hình ảnh, biểu đồ.<\/p>\n<table class=\"bang\"><tr><th><\/th><th>Phần mềm trình chiếu<\/th><th>Báo cáo treo tường<\/th><\/tr>\n<tr><td>Ưu điểm<\/td><td>Trình bày tuần tự, có hiệu ứng, hình, video; thuận tiện cho nhóm đông<\/td><td>Trực quan, thấy cả nội dung trên một tờ; người xem tự đọc, hỏi đáp trực tiếp<\/td><\/tr>\n<tr><td>Hạn chế<\/td><td>Cần máy tính, máy chiếu; phụ thuộc thiết bị<\/td><td>Diện tích có hạn nên phải tóm lược; đông người khó theo dõi cùng lúc<\/td><\/tr><\/table>\n<div class=\"nho\"><b>📌 Cần nhớ — Bài 1:<\/b> chức năng bát sứ, phễu, phễu chiết, bình cầu, lưới tản nhiệt · hoá chất dễ phân huỷ đựng lọ tối màu · đọc nhãn, không trộn bừa · báo cáo 8 phần đúng thứ tự · poster A0/A1, ít chữ nhiều hình.<\/div>\n","on":{"tn":[{"id":"b01-on-tn-01","lv":"NB","q":"Lưới tản nhiệt trong thí nghiệm khoa học tự nhiên dùng để làm gì?","o":["Tăng nhiệt độ","Đo nhiệt độ","Phân tán nhiệt","Giữ nhiệt"],"k":"D1AIVVtLAUkNVlQbOLTZltriREscldSaGlIHHwiYluwcVB5Rt9AHVxW6jAVIGgZQlcnuA0ESRQJIsP/Yz+MdW0EeRKjSBE5dlcnMGQZZTorT0U5NHAeIzNZZWQIGHE5Xt8EHEEG9vIrT9RsVVBkBtNUXSksGldWQAFIfltrYA0kV"},{"id":"b01-on-tn-02","lv":"NB","q":"Dụng cụ nào sau đây dùng để cô cạn dung dịch, đun nóng chảy chất rắn?","o":["Bát sứ","Bình cầu","Phễu chiết","Phễu thường"],"k":"D1AIVVtJAUkNVlQbNrHIA0EKzNDBVAr6zRwOV6XozNDrVBpLlcnwGU1Z6fodGk5Xt8EHEEEaRYrS1xcZFxqIzcQNDRmJzsFXWFIKtNVZ6fqJztlaVBoGltvOTksLt9oZF5PT1g9ZSR4GE05dlcniFAlXDxY="},{"id":"b01-on-tn-03","lv":"NB","q":"Hoá chất nào sau đây cần đựng trong lọ tối màu vì dễ bị phân huỷ bởi ánh sáng?","o":["NaCl","AgNO₃","CuO","Fe"],"k":"D1AIVVtIAUkNVlQbPz8HOIP7qUdINQl3O5Dr9EEdzNDtVAzYz/lJtMAXRUsbt89XE1IZH6LbQ0sAAY+Cw1IHtMsXDa/5ldWIGhVJAxMWQwxIGI+C+VIdltroREsFt85MWFKt5oDCrksGss9QVAaIzPAQA0kV"},{"id":"b01-on-tn-04","lv":"NB","q":"Dãy nào sau đây gồm toàn <b>acid<\/b>?","o":["HCl, H₂SO₄","NaOH, NH₃","CuO, MnO₂","S, I₂"],"k":"D1AIVVtJAUkNVlQbPDEFVxe6jUsgluy7Jz2L9eVZQajIVA9aHRZHVy8YYiNEVCBxlvDqVw26jUsKFR1cT1IqAi5VDSYGO4y79lIFtMFZQhMBEAsCVCFFVyibr+lIGK2ZVAIBHkESRAZGVhM="},{"id":"b01-on Cl₂ →(t°) 2FeCl₃<\/td><td>Khói nâu đỏ. <b>Sắt luôn tạo FeCl₃<\/b><\/td><\/tr>\n<tr><td>Cu + Cl₂ →(t°) CuCl₂ · 2Al + 3S →(t°) Al₂S₃ · Mg + S →(t°) MgS · Zn + S →(t°) ZnS<\/td><td><\/td><\/tr><\/table>\n<div class=\"nho\">Nhôm, kẽm, chromium phản ứng với O₂ ngay ở nhiệt độ thường, tạo <b>lớp oxide mỏng, bền<\/b> bảo vệ kim loại bên trong. Vàng không phản ứng với O₂ nên để lâu vẫn sáng.<\/div>\n<p><b>2. Với nước.<\/b> K, Na, Ca… tác dụng với nước <b>ở nhiệt độ thường<\/b> → hydroxide + H₂ (toả nhiều nhiệt): <code>2Na + 2H₂O → 2NaOH + H₂↑<\/code>. Zn, Fe… tác dụng với <b>hơi nước ở nhiệt độ cao<\/b> → oxide + H₂: <code>3Fe + 4H₂O →(t° cao) Fe₃O₄ + 4H₂<\/code>. Cu, Ag, Au <b>không<\/b> tác dụng với nước.<\/p>\n<p><b>3. Với dung dịch acid (HCl, H₂SO₄ loãng)<\/b> → muối + H₂↑.<\/p>\n<p><code>Fe + 2HCl → FeCl₂ + H₂↑<\/code> (sắt tạo muối iron(II)) · <code>2Al + 6HCl → 2AlCl₃ + 3H₂↑<\/code> · <code>Mg + 2HCl → MgCl₂ + H₂↑<\/code> · <code>Zn + 2HCl → ZnCl₂ + H₂↑<\/code>. Cu, Ag, Au không tác dụng với HCl.<\/p>\n<p><b>4. Với dung dịch muối.<\/b> Kim loại mạnh hơn <b>đẩy<\/b> kim loại yếu hơn ra khỏi dung dịch muối.<\/p>\n<table class=\"bang\"><tr><th>Phản ứng<\/th><th>Hiện tượng<\/th><\/tr>\n<tr><td>Fe + CuSO₄ → FeSO₄ + Cu<\/td><td>Chất rắn đỏ bám vào đinh sắt; xanh nhạt dần<\/td><\/tr>\n<tr><td>Cu + 2AgNO₃ → Cu(NO₃)₂ + 2Ag<\/td><td>Chất rắn trắng bạc bám vào dây đồng; dung dịch dần xanh<\/td><\/tr><\/table>\n<div class=\"nho\"><b>Lưu ý:<\/b> K, Na, Ca không đẩy kim loại khỏi dung dịch muối vì phản ứng với nước trước. VD: Na + dung dịch CuSO₄: 2Na + 2H₂O → 2NaOH + H₂; 2NaOH + CuSO₄ → Cu(OH)₂↓ (xanh) + Na₂SO₄.<\/div>\n<div class=\"nho\"><b>📌 Cần nhớ — Bài 18:<\/b> 4 tính chất vật lí · kim loại + O₂ → oxide, + phi kim khác → muối · Fe + Cl₂ → <b>FeCl₃<\/b>, Fe + HCl → <b>FeCl₂<\/b> · Na, K, Ca + nước thường → hydroxide + H₂ · kim loại mạnh đẩy kim loại yếu khỏi muối (trừ K, Na, Ca).<\/div>\n","on":{"tn":[{"id":"b18-on-tn-01","lv":"NB","q":"Dùng búa đập vào sợi dây nhôm, sợi dây bị cán mỏng dẹt ra. Điều này chứng tỏ nhôm có","o":["tính dẻo","tính cứng","tính rắn chắc","tính bền"],"k":"D1AIVVtJAUkNVlQbPxsEVw0WzNHJHU5at8FJAwmYluhIBq2RGl5JE6LYWUsFldW2GhVFVwq6hARIB4+C1xtJGQmYlvZIAK2UGhpJE4DDlgRGVhM="},{"id":"b18-on-tn-02","lv":"NB","q":"Kim loại nào sau đây dẫn điện tốt nhất?","o":["Au","Ag","Cu","Al"],"k":"D1AIVVtIAUkNVlQbNpPT1gJZBSoPXU5dlcjCGUG9vAKJz+lXVASq10EdzNHDGk5XHBuIzOYNDR+Jz/9NVBwBltvcWUVIMK2bDVKt5giYluwGVAr6zRwOV6XozND7GgkVVBwBtNUUDR2r2E5LlcjSVwm/jAVIGa2ZVASIzcoXDQ+JzsVXVLb4HoDCqgVIAI+C5QZHVRw="},{"id":"b18-on-tn-03","lv":"NB","q":"Kim loại nào sau đây phản ứng với nước ở điều kiện thường, giải phóng khí hydrogen?","o":["Cu","Au","Fe","K"],"k":"D1AIVVtKAUkNVlQbP15JOQBVDSgJVBr61RFJE4DCiAUPVBjYz+kAVw+/nYrT7w0Zlcn2Vw8RRIrT8xoZsOOIzPhZWQOuxI+C6RwOTUFLZktDVFxxlvDrOEGbq/lIRiV2PFJCVymbr+mK8v8XVg8="},{"id":"b18-on-tn-04","lv":"NB","q":"Kim loại nào sau đây tác dụng với hơi nước ở nhiệt độ cao tạo thành oxide kim loại?","o":["Zn","Cu","Ag","Au"],"k":"D1AIVVtJAUkNVlQbLhxFVyccDR+r1Q0ZEJPS0g8eDR2Jz/VQVBqv1ghZQ63YldWiF1KIzP5ZQwMBldW+AFKt5oDCtEsLFQEZAJPT1g5ZQhMBEAsZArHJVymbr+lTVC1MWFIoEE1ZbB5IHwb6wBwOVxERzNHLGk7Yz9sHEE9bUA=="},{"id":"b18-on-tn-05","lv":"NB","q":"Khi đốt dây sắt trong khí oxygen, sản phẩm tạo thành là","o":["FeO","Fe₂O₃","Fe₃O₄","Fe(OH)₃"],"k":"D1AIVVtLAUkNVlQbRzQMV0pZHySK9uwZlvT7XxW7nUJIMgvb9vEmleP9A0kV"},{"id":"b18-on-tn-06","lv":"TH","q":"Phương trình hoá học nào sau đây <b>đúng<\/b>?","o":["Cu + 2HCl → CuCl₂ + H₂","Fe + 2HCl → FeCl₂ + H₂","2Fe + 6HCl → 2FeCl₃ + 3H₂","Ag + HCl → AgCl + H₂"],"k":"D1AIVVtIAUkNVlQbMhdJXEExbgdIAI+D1R1JMQQ6QYnq9k4RHQAGGUkwZEJIFwZVGwAAEwRQA0srAUIZNRVJHAm6mQUPVB5RlcjKGUGYlsIGE05PlcnyHkExbgdGVhM="},{"id":"b18-on-tn-07","lv":"TH","q":"Ngâm đinh sắt vào dung dịch CuSO₄, hiện tượng quan sát được là","o":["có chất rắn màu đỏ bám vào đinh sắt, màu xanh của dung dịch nhạt dần","có khí không màu thoát ra","không có hiện tượng gì","có chất rắn màu trắng bạc bám vào đinh sắt"],"k":"D1AIVVtJAUkNVlQbMhdJXEE6WDgnluy tdVANWGFKL8fNZQ0MrAU5NFRxAV1xZHUdYRlsZGR0FV1xZHEdeVAkCVBxBNgZQDVZIREIJQVIEGA1ZEEtdWFoZE1KL8fNZQEtVVF8JVJDh5UFIAV1IX04MWEZJSkFIHkdQVAkXVl5LFAkMD1EOFQJKEQ8="}]}},{"id":"b19","ten":"Bài 19","mota":"Dãy hoạt động hoá học","tinh":true,"lt":"<h4>I. Xây dựng dãy hoạt động hoá học<\/h4>\n<p>Sắp xếp các kim loại theo thứ tự <b>khả năng phản ứng giảm dần<\/b> → dãy hoạt động hoá học.<\/p>\n<table class=\"bang\"><tr><th>Thí nghiệm<\/th><th>Quan sát<\/th><th>Kết luận<\/th><\/tr>\n<tr><td>Na, Fe, Cu + nước<\/td><td>Chỉ Na phản ứng (sủi bọt khí, toả nhiều nhiệt)<\/td><td>Na mạnh hơn Fe, Cu<\/td><\/tr>\n<tr><td>Fe, Cu + dung dịch HCl<\/td><td>Fe tan, có bọt khí H₂; Cu không phản ứng<\/td><td>Fe đứng <b>trước H<\/b>, Cu đứng <b>sau H<\/b><\/td><\/tr>\n<tr><td>Cu + dung dịch AgNO₃<\/td><td>Chất rắn trắng bạc bám vào dây đồng; dung dịch xanh<\/td><td>Cu mạnh hơn Ag<\/td><\/tr><\/table>\n<p>→ Thứ tự giảm dần: <b>Na &gt; Fe &gt; H &gt; Cu &gt; Ag<\/b>.<\/p>\n<div class=\"day\"><span class=\"m1\">K<\/span><span class=\"m1\">Na<\/span><span class=\"m1\">Ca<\/span><span class=\"m2\">Mg<\/span><span class=\"m2\">Al<\/span><span class=\"m2\">Zn<\/span><span class=\"m2\">Fe<\/span><span class=\"m2\">Pb<\/span><span class=\"mh\">(H)<\/span><span class=\"m3\">Cu<\/span><span class=\"m3\">Ag<\/span><span class=\"m3\">Au<\/span><\/div>\n<p class=\"nhe\">Mạnh: K, Na, Ca · Trung bình: Mg, Al, Zn, Fe, Pb · Yếu: Cu, Ag, Au. Hoạt động hoá học giảm dần từ <b>trái sang phải<\/b>.<\/p>\n<div class=\"nho\">Câu nhớ: <b>K<\/b>hi <b>N<\/b>ào <b>C<\/b>ần <b>M<\/b>ua <b>Á<\/b>o <b>G<\/b>iáp <b>S<\/b>ắt <b>P<\/b>hải <b>H<\/b>ỏi <b>C<\/b>ửa <b>B<\/b>ạc <b>V<\/b>àng.<\/div>\n\n<h4>II. Ý nghĩa của dãy hoạt động hoá học<\/h4>\n<table class=\"bang\"><tr><th>Ý<\/th><th>Nội dung<\/th><th>Ví dụ<\/th><\/tr>\n<tr><td>1<\/td><td>Từ <b>trái sang phải<\/b>, mức độ hoạt động <b>giảm dần<\/b><\/td><td>K mạnh hơn Na, Na mạnh hơn Ca…<\/td><\/tr>\n<tr><td>2<\/td><td>K, Na, Ca… tác dụng với <b>nước ở điều kiện thường<\/b> giải phóng H₂<\/td><td>2K + 2H₂O → 2KOH + H₂<\/td><\/tr>\n<tr><td>3<\/td><td>Kim loại đứng <b>trước H<\/b> + dung dịch acid (HCl, H₂SO₄ loãng) → muối + H₂<\/td><td>Zn + 2HCl → ZnCl₂ + H₂<\/td><\/tr>\n<tr><td>4<\/td><td>Kim loại đứng <b>trước<\/b> (trừ K, Na, Ca…) <b>đẩy<\/b> kim loại đứng <b>sau<\/b> khỏi dung dịch muối<\/td><td>Fe + CuSO₄ → FeSO₄ + Cu<\/td><\/tr><\/table>\n<p><b>Dự đoán nhanh (3 bước):<\/b> (1) Xác định vị trí hai kim loại / vị trí kim loại so với H. (2) Trước H → tác dụng acid; đứng trước → đẩy kim loại đứng sau khỏi muối. (3) Nếu kim loại là K, Na, Ca thì viết phản ứng với nước trước.<\/p>\n<p><b>Ứng dụng:<\/b><\/p>\n<ul><li><i>Làm sạch dung dịch:<\/i> loại CuCl₂ khỏi FeCl₂ → thêm Fe dư, lọc bỏ Cu. Loại AgNO₃ khỏi Cu(NO₃)₂ → thêm Cu dư.<\/li>\n<li><i>Thu hồi kim loại quý:<\/i> dùng Cu (hoặc Zn, Fe) đẩy Ag khỏi dung dịch AgNO₃.<\/li>\n<li><i>Phản ứng nhiệt nhôm:<\/i> 2Al + Fe₂O₃ →(t°) Al₂O₃ + 2Fe — dùng hàn đường ray, hàn thép.<\/li><\/ul>\n<div class=\"nho\"><b>📌 Cần nhớ — Bài 19:<\/b> thuộc dãy K, Na, Ca, Mg, Al, Zn, Fe, Pb, H, Cu, Ag, Au · 4 ý nghĩa của dãy · cặp nào phản ứng, cặp nào không (dựa vào vị trí) · Na, K, Ca vào dung dịch muối: xét phản ứng với nước trước.<\/div>\n","on":{"tn":[{"id":"b19-on-tn-01","lv":"NB","q":"Trong các kim loại Fe, K, Mg, Al, kim loại hoạt động hoá học mạnh nhất là","o":["Fe","K","Mg","Al"],"k":"D1AIVVtIAUkNVlQbIAAGGQZZSajLDU5RG5PT1hVZ6fqJz/dXE1IBGKLYDQOJz+NaWFIiV6XozNDBGgkZsOOIzcYMDQWr3gAZGZPT1g8RDQUAldScAFxLCg=="},{"id":"b19-on-tn-02","lv":"NB","q":"Kim loại nào sau đây đứng <b>sau<\/b> hydrogen trong dãy hoạt động hoá học?","o":["Mg","Zn","Cu","Fe"],"k":"D1AIVVtLAUkNVlQbMLHKDltZA0VGVChcWFI5FU1ZBSNBWE56AV5JNgZVDSodWk56AVKt5oDChAUPVB1YAVIhWUME"},{"id":"b19-on-tn-03","lv":"TH","q":"Sắt <b>không<\/b> tan trong dung dịch nào sau đây?","o":["HCl","Cu(NO₃)₂","AgNO₃","Mg(NO₃)₂"],"k":"D1AIVVtKAUkNVlQbMhdJs/CYlsIGE05KFQdJOgZZQ6jCGk5SHLHdGQZZ6fqJzsdAVLb4sdGYlsgLVCNeVBkBltr2REsFAY+C5RtHVRw="},{"id":"b19-on-tn-04","lv":"TH","q": Q8="}]}},{"id":"b20","ten":"Bài 20","mota":"Tách kim loại và hợp kim","tinh":true,"lt":"<h4>I. Phương pháp tách kim loại<\/h4>\n<p>Trong tự nhiên kim loại chủ yếu ở trong <b>quặng<\/b> dưới dạng hợp chất: <b>bauxite<\/b> (Al₂O₃) · <b>hematite<\/b> (Fe₂O₃) · <b>sphalerite<\/b> (ZnS). Vàng có thể tồn tại dạng đơn chất.<\/p>\n<p>Quy trình chung: Quặng →(làm giàu quặng) Hợp chất chứa kim loại →(phương pháp hoá học) Kim loại.<\/p>\n<table class=\"bang\"><tr><th>Phương pháp<\/th><th>Áp dụng cho<\/th><th>Cách làm<\/th><\/tr>\n<tr><td><b>Điện phân nóng chảy<\/b><\/td><td>Kim loại <b>mạnh<\/b>: Na, Ca, Mg, Al…<\/td><td>Điện phân hợp chất ở trạng thái nóng chảy<\/td><\/tr>\n<tr><td><b>Nhiệt luyện<\/b><\/td><td>Kim loại <b>trung bình<\/b>: Fe, Zn…<\/td><td>Dùng chất khử (C, CO, H₂, Al…) khử oxide kim loại ở nhiệt độ cao<\/td><\/tr>\n<tr><td><b>Thuỷ luyện<\/b><\/td><td>Kim loại <b>yếu<\/b>: Ag, Au…<\/td><td>Chuyển thành muối tan, dùng kim loại mạnh hơn đẩy ra khỏi dung dịch muối<\/td><\/tr><\/table>\n\n<h4>II. Tách một số kim loại quan trọng<\/h4>\n<p><b>Nhôm<\/b> — điện phân nóng chảy Al₂O₃ (quặng bauxite): <code>2Al₂O₃ →(đpnc, cryolite) 4Al + 3O₂<\/code>. <b>Cryolite<\/b> hạ nhiệt độ nóng chảy của Al₂O₃, tiết kiệm năng lượng. Hai điện cực bằng <b>than chì<\/b>; Al nóng chảy chìm ở đáy bể. Khí O₂ ở cực dương đốt cháy than chì (C + O₂ → CO₂) nên điện cực mòn dần.<\/p>\n<p><b>Sắt<\/b> — nhiệt luyện: <code>Fe₂O₃ + 3CO →(t°) 2Fe + 3CO₂<\/code><\/p>\n<p><b>Kẽm<\/b> — hai giai đoạn: đốt quặng <code>2ZnS + 3O₂ →(t°) 2ZnO + 2SO₂<\/code>; khử <code>ZnO + C →(t°) Zn + CO<\/code>.<\/p>\n<div class=\"nho\"><b>So sánh tách Zn và Fe:<\/b> giống — đều nhiệt luyện, dùng chất khử (C, CO). Khác — quặng sắt là oxide, khử trực tiếp bằng CO; quặng kẽm là sulfide, phải <b>đốt<\/b> thành ZnO trước rồi mới khử bằng C. <b>Natri không tách bằng nhiệt luyện<\/b> vì Na hoạt động rất mạnh, C hay CO không khử được oxide của Na; phải <b>điện phân nóng chảy<\/b>.<\/div>\n\n<h4>III. Hợp kim<\/h4>\n<p><b>Hợp kim<\/b> là vật liệu kim loại có chứa <b>ít nhất một kim loại cơ bản<\/b> và một số kim loại hoặc phi kim khác. Thường vượt trội kim loại nguyên chất về <b>độ cứng, độ bền, khả năng chống ăn mòn<\/b>.<\/p>\n<table class=\"bang\"><tr><th>Hợp kim<\/th><th>Thành phần<\/th><th>Đặc điểm – ứng dụng<\/th><\/tr>\n<tr><td><b>Gang<\/b><\/td><td>Fe + C (<b>2% – 5%<\/b>) + nguyên tố khác<\/td><td>Cứng, giòn; chi tiết máy, ống nước, nắp cống<\/td><\/tr>\n<tr><td><b>Thép<\/b><\/td><td>Fe + C (<b>dưới 2%<\/b>) + nguyên tố khác<\/td><td>Cứng, đàn hồi, chịu lực; xây dựng, giao thông<\/td><\/tr>\n<tr><td><b>Inox<\/b><\/td><td>Fe, C + Cr, Ni…<\/td><td>Cứng, khó gỉ; đồ gia dụng, thiết bị y tế<\/td><\/tr>\n<tr><td><b>Đuy-ra<\/b><\/td><td>Nhôm là kim loại cơ bản + Cu, Mn, Mg…<\/td><td>Nhẹ như nhôm nhưng bền, cứng; máy bay, ô tô<\/td><\/tr><\/table>\n\n<h4>IV. Sản xuất gang, thép<\/h4>\n<p><b>Gang<\/b> (lò cao; nguyên liệu: quặng sắt – hematite Fe₂O₃, than cốc, chất tạo xỉ như CaCO₃, SiO₂):<\/p>\n<table class=\"bang\"><tr><th>Giai đoạn<\/th><th>Phản ứng<\/th><\/tr>\n<tr><td>① Tạo khí CO<\/td><td>C + O₂ →(t°) CO₂ ; C + CO₂ →(t°) 2CO<\/td><\/tr>\n<tr><td>② CO khử oxide sắt → gang lỏng<\/td><td>3CO + Fe₂O₃ →(t°) 2Fe + 3CO₂<\/td><\/tr>\n<tr><td>③ Tạo <b>xỉ<\/b><\/td><td>CaCO₃ →(t°) CaO + CO₂ ; CaO + SiO₂ →(t°) CaSiO₃ (xỉ nhẹ, nổi trên gang lỏng)<\/td><\/tr><\/table>\n<p>Khí thải (CO₂, CO, SO₂, bụi…): CO₂ gây hiệu ứng nhà kính; SO₂ gây mưa acid, hại đường hô hấp; CO là khí độc → cần xử lí trước khi thải.<\/p>\n<p><b>Thép<\/b> (lò thổi): nguyên liệu <b>gang<\/b> (hoặc thép phế liệu) và <b>khí oxygen<\/b>. Thổi O₂ vào gang nóng chảy: tạp chất bị đốt cháy — oxide khí (CO₂, SO₂…) thoát ra; oxide rắn (SiO₂, MnO₂…) tạo xỉ nổi lên. Bản chất: <b>giảm hàm lượng C, Si, Mn… trong gang<\/b>.<\/p>\n<div class=\"nho\"><b>📌 Cần nhớ — Bài 20:<\/b> điện phân nóng chảy (Na, Ca, Mg, Al) · nhiệt luyện (Fe, Zn) · thuỷ luyện (Ag, Au) · cryolite hạ nhiệt độ nóng chảy của Al₂O₃ · gang 2–5% C, thép &lt; 2% C · 3 giai đoạn sản xuất gang · sản xuất thép: thổi O₂ vào gang lỏng.<\/div>\n","on":{"tn":[{"id":"b20-on-tn-01","lv":"NB","q":"Kim loại Na được điều chế bằng phương pháp nào sau đây?","o":["Phương pháp điện phân nóng chảy","Phương pháp nhiệt luyện với chất phản ứng là CO","Phương pháp nhiệt luyện với chất phản ứng là H₂","Phương pháp thuỷ luyện"],"k":"D1AIVVtJAUkNVlQbPxsEVw0WzNHJHU5UlcjIGQlZBSUJWE56FV5JOgZVDSoEWkAXXVIdtMAaRUsKldSIGhVJs/AQzNDvGk5JHLHLGUEX7tgGE05aHJPT1BhXDxY="},{"id":"b20-on-tn-02","lv":"NB","q":"Thành phần chính của quặng bauxite là","o":["Fe₃O₄","Al₂O₃","AlCl₃","Al₂(SO₄)₃"],"k":"D1AIVVtIAUkNVlQbNhMcDwgNSEsLHI+C3RNJNg2br+knluy6WlAU"},{"id":"b20-on-tn-03","lv":"NB","q":"Kim loại cơ bản của hợp kim đuy-ra (duralumin) là","o":["Fe","Cu","Al","Mg"],"k":"D1AIVVtLAUkNVlQbsOIcDkwLTFFIGgb6wB9JG6LZDQABGU5VG5PT1ghZTq3JVAzYztEHV0pZbh5EVCNXWFIkEE9XA0kV"},{"id":"b20-on-tn-04","lv":"NB","q":"Chất nào sau đây <b>không<\/b> phải nguyên liệu sản xuất gang?","o":["Quặng sắt","Than cốc","Đá vôi","Đất sét"],"k":"D1AIVVtKAUkNVlQbOhUcDqLTQ0sEHY+C8wdTVxAMzNHfGgkZB5PT2BVVDR8AFQAZF5PS5gJVDQgAldScAFIdltvYQksQldWwVFqt5qLYDR2rwAcXWlxAWUME"},{"id":"b20-on-tn-05","lv":"VD","q":"Điện phân nóng chảy 1,53 tấn Al₂O₃ (giả thiết hiệu suất 100%), thu được khối lượng nhôm là","o":["810 kg","720 kg","405 kg","360 kg"],"k":"D1AIVVtJAUkNVlQbGlooG4P7rySK9u0QVE9JRk1MHkRZRFwZSVJZW1FIGEtAABxQlcnuAkEUQgdBVIy/5lIHXyAVBEtVVF4VREFJlefrDQZISU4JWEpYVxWYl84GVFMZTENZVwoeA0kV"},{"id":"b20-on-tn-06","lv":"VD","q":"Cần ít nhất bao nhiêu tấn Fe₂O₃ để thu được 1 tấn gang có hàm lượng sắt 96,6%?","o":["1,035 tấn","1,480 tấn","0,69 tấn","1,38 tấn"],"k":"D1AIVVtKAUkNVlQbGVovEkhZEEtYWFcPQlIdltvcQ1BIGUZ/EZDr9S6br+hBVFMZRF5QQVdZ7vxIRVgJW0NYRUGbpONIRUIKTFIdltvcQ0VKCQ=="},{"id":"b20-on-tn-07","lv":"NB","q":"Hợp kim là","o":["vật liệu kim loại có chứa ít nhất một kim loại cơ bản và một số kim loại hoặc phi kim khác","chất tinh khiết có tên là kim loại","hỗn hợp chỉ gồm các phi kim","hợp chất của kim loại với oxygen"],"k":"D1AI ","k":"D1AIVVsiD1lKKUIbAFBTR09JAUkNVlQbMhdJAaLZDTEGWkwVVhEBAkNDSwoEBwtE"},{"id":"b20-kt-tln-14","lv":"VDC","q":"Trong bảng ba giai đoạn sản xuất gang có tất cả bao nhiêu phản ứng hoá học: C + O₂; C + CO₂; 3CO + Fe₂O₃; CaCO₃ →(t°); CaO + SiO₂? (đếm số phản ứng liệt kê)","g":"b20-kt-tln-14","t":"lt","k":"D1AIVVsiD15KKUIbAFBTR09JAUkNVlQbMxsIHkG9vASJzs9XVJD411tZH0sYHI+D1xxJltrQQwxTVIyo1UhJRkEJRYrS1wAZlcnAGQZCDYn51lQZRlIZH4DDjgVIldWQGhVJlefrDR+Jz/tXE1JcWUNVDwgAAUwDEhMFBAQE"},{"id":"b20-kt-tln-15","lv":"VDC","q":"Sắp xếp ba giai đoạn sản xuất gang theo đúng thứ tự: (1) CO khử oxide sắt tạo gang lỏng; (2) tạo xỉ; (3) tạo khí CO. Ghi dãy 3 chữ số liền nhau.","g":"b20-kt-tln-15","t":"lt","k":"D1AIVVsiD1hZRkxkWFAdVVtJA1tEVgsbTlA9H4DChEscldWITlKL5sFZWYrS1QEZHxqq2kE6YktAR0cZlvT7V4PojEsDHI+C2VIGDwgdSEsbldSWAFJBRkhZz+36VIyo1lIdltvYQksQldWwVFpbXkGbq/lIEK2aDVJaW0FIAUtaWkwVVhEBAkNDSwoEBwtE"},{"id":"b20-kt-tln-16","lv":"VD","q":"Điện phân nóng chảy 30,6 tấn Al₂O₃ với hiệu suất 90%. Khối lượng nhôm thu được là bao nhiêu tấn? (làm tròn 2 chữ số thập phân)","g":"b20-kt-tln-16","t":"tt","k":"D1AIVVsiD1pcWFsBVi9FVRVbF1tGRF8VVhdLTUM17sZIAAZMDZPTyBVDDVhYWFgZt+VJRlFBAllYQE4EVENfW1NZWYrS0QACVDpJSkFAHU5IluirVENdW1RBDR+JzstXWlBFVQIRWElSEg9VBxcU"},{"id":"b20-kt-tln-17","lv":"VD","q":"Cho 20 g đồng thau (hợp kim Cu – Zn) vào dung dịch HCl dư, thu được 3,7185 L khí H₂ (đkc). Phần trăm khối lượng của Cu trong đồng thau là bao nhiêu %? (làm tròn 2 chữ số thập phân)","g":"b20-kt-tln-17","t":"tt","k":"D1AIVVsiD15ZWFwMVi9FVRVbF1tGRFsVVhdLTUMXBTEGXU4EVBxBP4P7r0JISU4JWENcVwwWQUuK8vwZGVozGUhZEEtRWFkMVBVSVwxRbh5BVFMZRUJFRVRZSkuK8vwZRUJFRVRWH1tIt/kZRUJZUkFEDV5ZWFwMUVxLW0MaRR5KTghYGAEMCg=="},{"id":"b20-kt-tln-18","lv":"VDC","q":"Dẫn 7,437 L khí CO (đkc) qua ống sứ chứa 12 g một oxide kim loại M nung nóng. Sau phản ứng thu được kim loại M và hỗn hợp khí X có tỉ khối so với hiđro bằng 18. Khối lượng kim loại M thu được là bao nhiêu gam?","g":"b20-kt-tln-18","t":"tt","k":"D1AIVVsiD1JEQkxkWFAdVVtJA1tdWExcVkhLGUk6YkJISU4JWEFJGg4VFkswVAnYz+EEVyI2z+nqVEZBXVIftMFZbiRIEKiJVFoQXltZVUtDVBcZSVJZW1JCDV9cDE4SVEBRDkFEDVheVK2uVEJFREFEDVpYWFYZlvT7VxlZEEtYWF8MT1IQV1xZHUdZQUAZGlomVxULQgUPVAFBHRYMXkFEDQVANyHb9vBAV1xZHUdZQU5UGx5JlefrDQZAO0cZSVJbW1VZSkuK8vwZGVokXkFEDVpaVIyx5lJbW1VZEEtRWFgZE1xLW0MaRR5KTghYGAEMCg=="}]}},{"id":"th","ten":"Tổng hợp","mota":"Bài 18 – 19 – 20","tinh":true,"lt":"<p>Quy ước: thể tích khí đo ở điều kiện chuẩn (đkc: 25 °C, 1 bar): <b>1 mol khí = 24,79 L<\/b>. Khối lượng nguyên tử: H = 1; C = 12; O = 16; Na = 23; Mg = 24; Al = 27; S = 32; Cl = 35,5; K = 39; Ca = 40; Fe = 56; Cu = 64; Zn = 65; Ag = 108.<\/p>\n<h4>1. Công thức tính toán<\/h4>\n<table class=\"bang\"><tr><th>Đại lượng<\/th><th>Công thức<\/th><\/tr>\n<tr><td>Số mol theo khối lượng<\/td><td><b>n = m / M<\/b> (m: g; M: g/mol)<\/td><\/tr>\n<tr><td>Số mol khí ở đkc<\/td><td><b>n = V / 24,79<\/b> (V: L)<\/td><\/tr>\n<tr><td>Nồng độ mol<\/td><td><b>C<sub>M<\/sub> = n / V<sub>dd<\/sub><\/b> (V<sub>dd<\/sub>: L)<\/td><\/tr>\n<tr><td>Phần trăm khối lượng<\/td><td><b>%m(A) = m(A) / m(hh) × 100%<\/b><\/td><\/tr>\n<tr><td>Hiệu suất<\/td><td><b>H% = lượng thực tế / lượng lí thuyết × 100%<\/b><\/td><\/tr><\/table>\n<h4>2. Giải bài toán kim loại — 4 bước<\/h4>\n<ol><li>Đọc đề, tính số mol các chất đã biết.<\/li><li>Viết PTHH đúng, <b>cân bằng<\/b>; xét vị trí trong dãy hoạt động.<\/li><li>Lập tỉ lệ mol theo PTHH; nếu cho lượng hai chất → tìm chất dư (so sánh n / hệ số).<\/li><li>Tính đại lượng cần tìm, kiểm tra đơn vị và chữ số thập phân.<\/li><\/ol>\n<h4>3. Dạng bài thường gặp<\/h4>\n<table class=\"bang\"><tr><th>Dạng<\/th><th>Cách làm nhanh<\/th><\/tr>\n<tr><td>Kim loại + acid → H₂<\/td><td>Mg, Zn, Fe: n(KL) = n(H₂). Al: n(Al) = (2/3)·n(H₂)<\/td><\/tr>\n<tr><td>Hỗn hợp hai kim loại + acid<\/td><td>Đặt ẩn x, y; lập hệ hai phương trình (khối lượng; số mol H₂)<\/td><\/tr>\n<tr><td>Xác định kim loại M (hoá trị n)<\/td><td>Tính n(M) theo PTHH → M = m/n(M) → thử n = 1, 2, 3<\/td><\/tr>\n<tr><td>Thanh kim loại tăng/giảm khối lượng<\/td><td>Δm = (khối lượng kim loại bám vào) − (khối lượng kim loại tan ra)<\/td><\/tr>\n<tr><td>Khử oxide bằng CO, H₂<\/td><td>n(O trong oxide) = n(CO) = n(H₂); m(kim loại) = m(oxide) − m(O)<\/td><\/tr>\n<tr><td>Sản xuất gang, thép; điện phân Al₂O₃<\/td><td>Bảo toàn nguyên tố: m(Fe) = m(Fe₂O₃) × 112/160; m(Al) = m(Al₂O₃) × 54/102; nhân hiệu suất<\/td><\/tr><\/table>\n<h4>4. Lỗi hay gặp<\/h4>\n<ul><li>Viết Fe + HCl → <b>FeCl₃<\/b> (đúng: <b>FeCl₂<\/b>); Fe + Cl₂ → <b>FeCl₃<\/b>.<\/li>\n<li>Quên cân bằng PTHH, hoặc cân bằng sai hệ số.<\/li>\n<li>Cho Na, K, Ca vào dung dịch muối mà viết \"đẩy kim loại\" (đúng: phản ứng với nước trước).<\/li>\n<li>Dùng 22,4 L/mol (ở đây dùng <b>24,79 L/mol<\/b>).<\/li>\n<li>Quên đổi mL → L khi dùng C<sub>M<\/sub> = n/V.<\/li>\n<li>Nhầm gang (2–5% C) và thép (dưới 2% C).<\/li>\n<li>Nhầm phương pháp: Na, Al → điện phân nóng chảy; Fe, Zn → nhiệt luyện; Ag, Au → thuỷ luyện.<\/li><\/ul>\n","on":{"tn":[{"id":"th-on-tn-01","lv":"NB","q":"Kim loại nào sau đây có thể được tách ra khỏi oxide của nó bằng phương pháp nhiệt luyện?","o":["Ca","Al","Fe","K"],"k":"D1AIVVtLAUkNVlQbMhdFVzsXDR+r1Q1RVBCIzdAXSksGHAfYz/UdVw0MVIrT8wACVDEIW0E4QUdIP05Nt9MKH0EbzNHZGgkZsOMAltr+Q0sYHK2bGlIHtNIXSksLHI+D1wtHVRw="},{"id":"th-on-tn-02","lv":"TH","q":"Kim loại nào sau đây vừa được tách bằng điện phân nóng chảy, vừa tác dụng với nước ở điều kiện thường?","o":["Na","Fe","Cu","Zn"],"k":"D1AIVVtJAUkNVlQbOhNJG6LZDQABGU5VG5PT1ghZQIrS1QBRTlIdtMAaRUsKldSIGhVJs/AQzNDvGk5JHLHLGUEX7tgGE05aHJPT1BhZW6jIVB5RlcjKGUGYlsIGE05PlcnyHkEX69uJz/VaVJPS6EEXRQKJz+lNVLb4ltrgDR8Ast7Yz+8HEE9bUA=="},{"id":"th-on-tn-03","lv":"TH","q":"Cho một mẩu Na vào dung dịch CuSO₄, hiện tượng quan sát được là","o":["có chất rắn màu đỏ bám vào mẩu Na","mẩu Na tan, có khí thoát ra và xuất hiện kết tủa màu xanh","không có hiện tượng gì","mẩu Na tan, có khí thoát ra và xuất hiện kết tủa màu trắng"],"k":"D1AIVVtIAUkNVlQbRjwIV0pZHyOK9ux2VJDv5UFLYwonPE4SVDqL9eNCDVkmFSFxVFlJNBQqYonq8E7b8uBJNBRRYiNBluy7lvT6V0kBTA g với dung dịch HCl và nước cất, thu được kết quả:<table class=\"bang\"><tr><th>Kim loại<\/th><th>Với dung dịch HCl<\/th><th>Với nước cất<\/th><\/tr><tr><td>X<\/td><td>Giải phóng H₂ chậm<\/td><td>Không phản ứng<\/td><\/tr><tr><td>Y<\/td><td>Giải phóng H₂ nhanh<\/td><td>Không phản ứng<\/td><\/tr><tr><td>Z<\/td><td>Không phản ứng<\/td><td>Không phản ứng<\/td><\/tr><tr><td>T<\/td><td>Giải phóng H₂ nhanh<\/td><td>Giải phóng H₂ nhanh, dung dịch nóng lên<\/td><\/tr><\/table>","it":["T là kim loại hoạt động hoá học mạnh nhất trong bốn kim loại.","Z đứng sau hydrogen trong dãy hoạt động hoá học.","Thứ tự hoạt động hoá học giảm dần: T > Y > X > Z.","X đứng sau hydrogen trong dãy hoạt động hoá học."],"k":"D1AIVVsiWRkdEUJNBgcMWxULWA5EEg9VBxc0W0McD1EzVjoZBBqIzcIXDYrT3QBeVBGIzcJZW4rT7wcZGrTZltriTkscHKiJlcn0GQZXD0dKLk5SHLHdGQZZXQOJzs1XVJPS3g8eDR2Jz/VQVDoqG09bAUkxVB5RlcjKGUGYlsIGE05xNx5JGQkYQwNIHKiYGlIxWUNVDzNIBAbYztEHV4DChAUPVKqossKIzMIaDR2Jz/VQVDoqG0EX7sEGVKqolcnAGQZZWRmuxI+C7xFJP09bcBY="},{"id":"b19-kt-ds-03","lv":"NB","q":"Nhận định về thứ tự trong dãy hoạt động hoá học:","it":["Dãy K, Na, Ca, Mg, Al, Zn, Fe, Pb, (H), Cu, Ag, Au sắp xếp theo mức độ hoạt động giảm dần.","Fe đứng trước Cu nên hoạt động hoá học mạnh hơn Cu.","Pb đứng trước Zn trong dãy.","Ag đứng sau H nên không tác dụng với dung dịch HCl."],"k":"D1AIVVsiWRkdEUJNBgcMWwcYQRgNWBpLARc0W0McD1EzVqqpt8gHEE9bAUms5K2DGhVHVU1bfQlIsP/Yz9sHEEEKTB5ILgAZArHJVyccA0lEVqqpt8gHEE9bcBY="},{"id":"b19-kt-ds-04","lv":"NB","q":"Thí nghiệm xây dựng dãy hoạt động hoá học với Na, Fe, Cu, Ag:","it":["Trong ba kim loại Na, Fe, Cu, chỉ Na phản ứng với nước ở điều kiện thường.","Fe tan trong dung dịch HCl, có bọt khí H₂.","Cu phản ứng với dung dịch HCl giải phóng H₂.","Cu đẩy Ag ra khỏi dung dịch AgNO₃, dung dịch dần chuyển xanh."],"k":"D1AIVVsiWRkdEUJNBgcMWwcYQRgNWBpLARc0W0McD1EzVqqpt8gHEE9bAUkuEU795ZPS3g8eDR8ast7Yz+kKVylXD0dKNxsZsOOIzMgXSksbFRsZPFxLW0O9vajSGgkXVi8U"},{"id":"b19-kt-ds-05","lv":"TH","q":"Nhận định về sắt trong dãy hoạt động function acx(){ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === "suspended") AC.resume(); return AC; }
function nota(f, t0, dur, vol, type){ const o = AC.createOscillator(), g = AC.createGain(); o.type = type || "sine"; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .03); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + .05); }
function nhacDung(){ if(nhacTimer){ clearInterval(nhacTimer); nhacTimer = null; } }
function nhacChay(){
  nhacDung(); if(!nhacOn || !amOn) return;
  try{ acx(); }catch(e){ return; }
  const A = [262, 330, 392, 330, 294, 349, 440, 349, 262, 330, 392, 523, 392, 330, 294, 196];   // giai điệu nhẹ, lặp lại
  nhacTimer = setInterval(() => { try{ const t = AC.currentTime + .05; const f = A[nhacBuoc % A.length];
    nota(f, t, .55, .035); if(nhacBuoc % 4 === 0) nota(f / 2, t, 1.1, .03, "triangle"); nhacBuoc++; }catch(e){} }, 480);
}
function fanfare(){
  if(!amOn) return;
  try{ acx(); const t = AC.currentTime + .05; [[523,0],[659,.12],[784,.24],[1047,.36]].forEach(([f, d]) => nota(f, t + d, .35, .16, "triangle"));
    [523,659,784].forEach(f => nota(f, t + .6, .9, .09)); }catch(e){}
}
function nutNhac(){
  let b = $("#nhac");
  if(!b){ b = document.createElement("button"); b.id = "nhac"; b.className = "btn gh"; b.setAttribute("aria-label", "Bật tắt nhạc nền");
    b.style.cssText = "position:fixed;right:14px;bottom:14px;z-index:50;min-height:44px;box-shadow:0 4px 14px rgba(0,0,0,.18);background:var(--card,#fff)";
    b.onclick = () => { nhacOn = !nhacOn; LS.set("nhac", nhacOn); if(nhacOn){ if(!amOn){ amOn = true; LS.set("am", true); } nhacChay(); } else nhacDung(); nutNhac(); };
    document.body.appendChild(b); }
  b.textContent = nhacOn && amOn ? "🎵 Nhạc: bật" : "🎵 Nhạc: tắt";
}
function capNhatNhac(h){
  const onOn = /\/on(\/|$)/.test(h);

}

function hoTenHopLe(raw){
  const t = raw.replace(/\s+/g, " ").trim();
  if(t.length < 4) return {ok:false, m:"Em nhập đủ họ và tên (ít nhất 2 từ)."};
  if(t.length > 40) return {ok:false, m:"Họ tên dài quá 40 chữ, em kiểm tra lại."};
  if(!/^\p{L}[\p{L}'’.\-]*(?: \p{L}[\p{L}'’.\-]*){1,5}$/u.test(t)) return {ok:false, m:"Họ tên chỉ gồm chữ cái và dấu cách (không số, không kí hiệu)."};
  const dep = t.split(" ").map(w => w.charAt(0).toLocaleUpperCase("vi") + w.slice(1).toLocaleLowerCase("vi")).join(" ");
  return {ok:true, v:dep};
}

/* ===================== chấm điểm ===================== */
const DS_DIEM = [9999999, 99999999999999,  99999999999999, 99999999999999,  99999999999999];
const SUBS = "₀₁₂₃₄₅₆₇₈₉";
const chuanChu = t => String(t).replace(/[₀-₉]/g, c => SUBS.indexOf(c)).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[đĐ]/g, "d").toLowerCase().replace(/[\s·.,;:'"\-<>→]/g, "");
const LA_SO = a => /^-?\d+(?:[.,]\d+)?$/.test(String(a).trim());
function chamTLN(k, s){
  s = String(s || "").trim(); if(!s) return false;
  for(const ans of k.a){
    if(LA_SO(ans)){
      if(/^\d{4,}$/.test(ans)){ if(s.replace(/\D/g, "") === ans) return true; continue; }
      const m = s.replace(/\s/g, "").replace(",", ".").match(/^(-?\d+(?:\.\d+)?)[^\d]*$/); if(!m) continue;
      if(Math.abs(parseFloat(m[1]) - parseFloat(ans.replace(",", "."))) <= (k.t || 0) + 1e-9) return true;
    } else if(chuanChu(s) === chuanChu(ans)) return true;
  }
  return false;
}
const dapAnHienThi = k => LA_SO(k.a[0]) ? k.a[0].replace(".", ",") : k.a[0];
function chamCau(it){
  const q = QMAP[it.id], k = giai(q.k);
  if(it.loai === "tn") return {d: it.ans === k.a ?  99999999999999 : 0, got: it.ans === k.a ? 1 : 0, max: 1};
  if(it.loai === "ds"){ const c = (it.ans || []).filter((v, i) => v === k.a[i]).length; return {d: DS_DIEM[c], got: c, max: 4}; }
  const ok = chamTLN(k, it.ans); return {d: ok ? DATA.de.tln.diem : 0, got: ok ?  99999999999999 : 0, max: 1};
}

function chonTheoMuc(pool, quota, rnd, usedG){
  const out = []; usedG = usedG || new Set();
  for(const [lv, n] of Object.entries(quota)) for(let i = 0; i < n; i++){
    const li = LV.indexOf(lv);
    const cand = shuffle(pool.filter(q => !out.includes(q)), rnd).sort((a, b) => (Math.abs(LV.indexOf(a.lv) - li) - Math.abs(LV.indexOf(b.lv) - li)) || (Number(usedG.has(a.g)) - Number(usedG.has(b.g))));
    const q = cand[0]; if(!q) break; out.push(q); if(q.g) usedG.add(q.g);
  }
  return out;
}
function dungDe(bid, seed){
  const b = BAIMAP[bid], rnd = mulberry32(seed), items = [], de = DATA.de;
  const them = (qs, l) => shuffle(qs, rnd).forEach(q => items.push({id:q.id, loai:l, perm: l === "tln" ? null : shuffle([0,1,2,3], rnd), ans: l === "tn" ? null : l === "ds" ? [null,null,null,null] : "", flag:false}));
  them(chonTheoMuc(b.kt.tn, de.tn.mau, rnd), "tn");
  them(chonTheoMuc(b.kt.ds, de.ds.mau, rnd), "ds");
  // Phần III: bài có tính toán -> 4 câu lí thuyết + 2 câu tính toán (≈70% / 30%); bài không có tính toán -> 6 câu lí thuyết
  const g = new Set(), poolLT = b.kt.tln.filter(q => q.t === "lt"), poolTT = b.kt.tln.filter(q => q.t === "tt");
  const ql = chonTheoMuc(poolLT, b.tinh ? de.tln.lt : de.tln.lt_het, rnd, g);
  const qt = b.tinh ? chonTheoMuc(poolTT, de.tln.tt, rnd, g) : [];
  them(ql.concat(qt), "tln");
  return items;
}

function luuThi(){ LS.set("exam", exam); }
function capNhatDongHo(){
  if(!exam || !$("#tm")){ clearInterval(tick); return; }
  const c = Math.max(0, exam.end - NOW()), m = Math.floor(c / 60000), s = Math.floor(c % 60000 / 1000);
  $("#tm").textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0"); $("#tm").classList.toggle("low", c < 300000);
  if(c <= 0){ clearInterval(tick); nopBai(true); }
}
addEventListener("beforeunload", e => { if(exam && NOW() < exam.end){ e.preventDefault(); e.returnValue = ""; } });
function hoiNop(){
  const chua = exam.items.map((x, i) => ({x, i})).filter(o => trangThai(o.x) !== "done");
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="card"><h3>Nộp bài?</h3>${chua.length ? `<p>Em còn <b>${chua.length} câu chưa làm xong</b>: ${chua.map(o => `<button class="nb ${trangThai(o.x)}" style="width:40px;margin:2px" data-i="${o.i}">${o.i + 1}</button>`).join("")}</p><p>Em có muốn quay lại làm tiếp không?</p>` : `<p>Em đã làm xong tất cả các câu. Nộp bài nhé?</p>`}
    <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap"><button class="btn sec" id="hq">Làm tiếp</button><button class="btn ok" id="cn">Nộp bài</button></div></div>`;
  document.body.appendChild(m);
  $$(".nb", m).forEach(el => el.onclick = () => { exam.i = +el.dataset.i; luuThi(); m.remove(); veThi(); });
  $("#hq", m).onclick = () => m.remove(); $("#cn", m).onclick = () => { m.remove(); nopBai(false); };
}
function nopBai(het){
  clearInterval(tick);
  const e = exam; exam = null; LS.del("exam");
  const r = {tn:0, ds:0, tln:0, dungTN:0, dungDS:0, dungTL:0, ct:[]};
  const theoBai = {};
  e.items.forEach(it => { const c = chamCau(it); r[it.loai] += c.d; r.ct.push(it.id + "=" + c.got);
    if(it.loai === "tn" && c.got) r.dungTN++; if(it.loai === "ds" && c.got === 4) r.dungDS++; if(it.loai === "tln" && c.got) r.dungTL++;
    const nb = it.id.split("-")[0]; const t = theoBai[nb] = theoBai[nb] || {d:0, t:0}; t.t += 1; t.d += c.got / c.max; });
  const diem = Math.round((r.tn + r.ds + r.tln) * 100) / 100;
  const giay = Math.min(DATA.phut * 60, Math.round((NOW() - e.start) / 1000));
  const bg = {id: "L" + e.start.toString(36) + Math.random().toString(36).slice(2, 6), t: new Date().toISOString(), ten: e.user.ten, lop: e.user.lop, bai: nhanBai(e.bai), baiId: e.bai,
    diem, p1: Math.round(r.tn * 100) / 100, p2: Math.round(r.ds * 100) / 100, p3: Math.round(r.tln * 100) / 100, dungTN: r.dungTN, dungDS: r.dungDS, dungTL: r.dungTL, giay, hetGio: !!het, ct: r.ct.join(";")};
  const lich = tuoiLuyen(); lich.push({bai:e.bai, diem, t:bg.t}); LS.set("lich", lich.slice(-60));
  LS.set("ket-qua-" + e.bai, {bg, theoBai, items: e.items, user: e.user, het: !!het});
  guiMot(bg).then(() => { if(CUR.indexOf("/ketqua") > 0) manKetQua(e.bai); });
  go("#" + e.bai + "/ketqua");
}

/* ===================== KẾT QUẢ ===================== */
function manKetQua(bid){
  const kq = LS.get("ket-qua-" + bid, null);
  if(!kq){ return go("#" + bid + "/kt"); }
  const bg = kq.bg, n = TONG_CAU(), pc = bg.diem / 10, col = pc >= .8 ? "var(--ok)" : pc >= .5 ? "var(--pri)" : "var(--bad)";
  const R = 88, C = 2 * Math.PI * R;
  const lop = bg.diem >= 9 ? "Xuất sắc! 🌟" : bg.diem >= 8 ? "Giỏi! 👏" : bg.diem >= 6.5 ? "Khá 👍" : bg.diem >= 5 ? "Đạt — cố gắng thêm nhé 💪" : "Cần ôn lại — em đừng nản nhé 🤗";
  if(bg.diem >= 8) setTimeout(() => { confetti(); fanfare(); }, 300);
  const outbox = LS.get("outbox", []).some(x => x.id === bg.id);
  const tt = !CFG.sheetUrl ? `<div class="state wait">ℹ️ Kết quả được lưu trên máy này. (Chưa nối Google Sheet của cô.)</div>` :
    outbox ? `<div class="state no">⚠️ Chưa gửi được kết quả cho cô (mạng yếu?). Bài của em vẫn được giữ trên máy. <button class="btn" id="gl" style="min-height:38px;margin-left:8px">Gửi lại</button></div>` :
    `<div class="state ok">✓ Kết quả đã được gửi về sổ của cô giáo.</div>`;
  // gợi ý ôn lại
  const g = [];
  if(bid === "th"){ const t = Object.entries(kq.theoBai).filter(([k]) => BAIMAP[k] && k !== "th").map(([k, v]) => [k, v.d / v.t]).sort((a, b) => a[1] - b[1]); if(t.length && t[0][1] < .7) g.push(`Em còn yếu phần <b>${esc(BAIMAP[t[0][0]].ten)}</b> — vào mục Ôn tập của bài đó để luyện thêm.`); }
  if(bg.p1 < DATA.de.tn.diem * NSEC("tn") * .6) g.push(`Phần trắc nghiệm còn sai nhiều: em đọc lại <b>Lý thuyết</b> rồi làm Ôn tập trắc nghiệm.`);
  if(bg.p2 < DATA.de.ds.diem * NSEC("ds") * .5) g.push(`Câu Đúng/Sai: đọc kĩ từng ý, nhớ các điểm hay nhầm trong mục “Cần nhớ”.`);
  if(bg.p3 < DATA.de.tln.diem * NSEC("tln") * .6) g.push(`Câu trả lời ngắn / tính toán: luyện lại công thức <code>n = m/M</code>, <code>V = n × 24,79</code>, <code>C<sub>M</sub> = n/V</code> và viết đúng PTHH cân bằng.`);
  if(!g.length) g.push(`Em làm rất tốt! Thử làm lại bài kiểm tra (đề mới được xáo) hoặc sang bài khác nhé.`);
  app.innerHTML = dauBai(bid, "kt") + `<div class="card res">${MASCOT(bg.diem >= 8 ? "wow" : bg.diem >= 5 ? "happy" : "sad")}
    <h2 style="margin:4px 0">Kết quả của ${esc(kq.user.ten)} · lớp ${esc(kq.user.lop)}</h2>
    <div class="ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--line)" stroke-width="16"/><circle cx="100" cy="100" r="${R}" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pc)}" style="transition:stroke-dashoffset 1s"/></svg>
      <div class="v"><b style="color:${col}">${so(bg.diem)}</b><span>/ 10 điểm</span></div></div>
    <h3 style="margin:2px 0">${lop}</h3>${kq.het ? `<div class="nhe">⏰ Hết giờ — bài được nộp tự động.</div>` : `<div class="nhe">Thời gian làm bài: ${Math.floor(bg.giay / 60)} phút ${bg.giay % 60} giây</div>`}
    <div class="parts"><div class="part"><small>Phần I · Trắc nghiệm</small><b>${so(bg.p1)}</b> / ${so(DATA.de.tn.diem * NSEC("tn"))}<small>đúng ${bg.dungTN}/${NSEC("tn")} câu</small></div>
      <div class="part"><small>Phần II · Đúng/Sai</small><b>${so(bg.p2)}</b> / ${so(DATA.de.ds.diem * NSEC("ds"))}<small>đúng trọn ${bg.dungDS}/${NSEC("ds")} câu</small></div>
      <div class="part"><small>Phần III · Trả lời ngắn</small><b>${so(bg.p3)}</b> / ${so(DATA.de.tln.diem * NSEC("tln"))}<small>đúng ${bg.dungTL}/${NSEC("tln")} câu</small></div></div>
    ${tt}
    <div class="hint"><b>💡 Gợi ý cho em</b><ul style="margin:.4em 0 0 1.1em;padding:0">${g.map(x => `<li>${x}</li>`).join("")}</ul>
      <div class="nhe" style="margin-top:8px">Đáp án chi tiết sẽ được cô công bố sau — em chưa xem được ở đây.</div></div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="go('#${bid}/kt')">🔁 Làm lại (đề mới)</button><button class="btn sec" onclick="go('#${bid}/on')">✏️ Ôn tập thêm</button><button class="btn gh" onclick="go('#bai')">🏠 Các bài</button>
    ${caiDat.moDapAn ? `<button class="btn ok" id="xd">👁️ Xem đáp án & giải thích</button>` : ""}</div></div>${chan()}</div>`;
  if($("#gl")) $("#gl").onclick = async () => { $("#gl").disabled = true; await guiTatCa(); manKetQua(bid); };
  if($("#xd")) $("#xd").onclick = () => xemDapAn(bid);
}
function xemDapAn(bid){
  const kq = LS.get("ket-qua-" + bid, null); if(!kq) return;
  const rows = kq.items.map((it, i) => {
    const q = QMAP[it.id], k = giai(q.k), c = chamCau(it); let ct = "";
    if(it.loai === "tn") ct = it.perm.map((oi, p) => `<div class="op lock ${oi === k.a ? "good" : it.ans === oi ? "wrong" : ""}"><span class="l">${"ABCD"[p]}</span><span>${esc(q.o[oi])}</span></div>`).join("") + `<div class="fb ${c.got ? "ok" : "no"}">${esc(k.e)}</div>`;
    else if(it.loai === "ds") ct = it.perm.map((ii, p) => { const ok = it.ans[ii] === k.a[ii]; return `<div class="ds ${ok ? "good" : "wrong"}"><span class="l">${"abcd"[p]}</span><span>${esc(q.it[ii])}</span><span class="tf"><b>${k.a[ii] ? "Đúng" : "Sai"}</b></span><span class="ex">Em chọn: ${it.ans[ii] === null ? "chưa chọn" : it.ans[ii] ? "Đúng" : "Sai"}. ${k.e[ii]}</span></div>`; }).join("");
    else ct = `<div class="fb ${c.got ? "ok" : "no"}">Em điền: <b>${esc(it.ans || "—")}</b> · Đáp án: <b>${esc(dapAnHienThi(k))}</b><br>${esc(k.e)}</div>`;
    return `<div class="card q" style="margin-bottom:12px"><div class="no"><span class="n">Câu ${i + 1}</span><span class="chip ${c.got === c.max ? "nb" : "vdc"}">${c.got === c.max ? "Đúng" : "Chưa đúng"}</span></div><div class="txt">${q.q}</div>${ct}</div>`; }).join("");
  app.innerHTML = dauBai(bid, "kt") + `<h3>Đáp án & giải thích — bài của em</h3>${rows}<div class="nav"><button class="btn" onclick="manKetQua('${bid}')">← Về kết quả</button></div>${chan()}</div>`;
}

/* ===================== gửi Google Sheet ===================== */
async function guiMot(bg){
  const ob = LS.get("outbox", []); if(!ob.some(x => x.id === bg.id)) ob.push(bg); LS.set("outbox", ob);
  return guiTatCa();
}
let dangGui = false;
async function guiTatCa(){
  if(!CFG.sheetUrl || dangGui) return; dangGui = true;
  try{
    let ob = LS.get("outbox", []);
    for(const bg of ob.slice()){
      try{
        const r = await fetch(CFG.sheetUrl, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(bg)});
        const j = await r.json(); if(j && j.ok){ ob = ob.filter(x => x.id !== bg.id); LS.set("outbox", ob); }
      }catch(e){ break; }
    }
  } finally { dangGui = false; }
  if(!LS.get("outbox", []).length) LS.del("outbox");
}
async function layCaiDat(){
  if(!CFG.sheetUrl) return;
  try{ const r = await fetch(CFG.sheetUrl + "?action=caidat"); const j = await r.json(); if(j) caiDat = {moDapAn: !!j.moDapAn}; }catch(e){}
}

/* ===================== khởi động ===================== */
(function khoiDong(){
  if(exam && NOW() >= exam.end && user){ try{ nopBai(true); return; }catch(e){ LS.del("exam"); exam = null; } }
  layCaiDat();
  route();
})();
</script>
